<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <title>DocuMaker Editor</title>
  <style>
    :root{--ink:#25243a;--muted:#73748c;--accent:#6557d2;--accent-soft:#eeeaff;--paper:#fff;--canvas:#f1f0f7;--line:#e7e5ef;--highlight:#fff1a8}
    *{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    body{padding:14px 9px 28px}.sheet{background:var(--paper);width:100%;max-width:820px;min-height:950px;margin:0 auto 18px;padding:30px 25px 70px;border:1px solid #e9e7ef;border-radius:14px;box-shadow:0 8px 28px rgba(35,31,71,.07);outline:none;overflow-wrap:anywhere}
    #editor{min-height:800px;outline:none;font-size:16px;line-height:1.55;white-space:normal}#editor:empty:before{content:'Start writing your document…';color:#a3a2b5;pointer-events:none}
    h1{font-size:2em;line-height:1.18;margin:.6em 0 .35em}h2{font-size:1.5em;margin:.9em 0 .35em}h3{font-size:1.2em}p{margin:.48em 0}ul,ol{padding-left:26px}table{border-collapse:collapse;width:100%;margin:14px 0;table-layout:fixed}td,th{border:1px solid #c9c7d4;padding:8px;min-width:45px;vertical-align:top}th{background:#f4f2fb;font-weight:700}img{max-width:100%;height:auto;border-radius:5px}.page-break{border:0;border-top:2px dashed #b9b4d5;margin:28px 0;position:relative;height:1px;page-break-after:always}.page-break:after{content:'PAGE BREAK';position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:1px;background:white;color:#8d89a6;padding:0 8px}.comment-mark{background:#fff1a8;border-bottom:2px solid #c6a63d}.suggestion-insert{background:#e3f6e9;border-bottom:2px solid #49a56d}.doc-header,.doc-footer{padding:8px 0;color:#77768d;font-size:12px;border-bottom:1px solid #e7e5ef}.doc-footer{border-bottom:0;border-top:1px solid #e7e5ef;margin-top:24px}.bookmark-anchor{display:block;border-top:1px dashed #a69fca;color:#716b95;text-align:center;margin:12px 0;font-size:11px}
    .doc-footnote{font-size:11px;color:#9a98aa}.print-mode body{background:#fff;padding:0}.print-mode .sheet{box-shadow:none;border:0;border-radius:0;margin:0 auto;padding:0;max-width:none}
    @media(min-width:600px){body{padding:22px}.sheet{padding:55px 64px}}
    @media print{body{background:white;padding:0}.sheet{box-shadow:none;border:0;margin:0;padding:0;max-width:none;border-radius:0}.page-break{break-after:page}}
  </style>
</head>
<body>
  <main class="sheet"><article id="editor" contenteditable="true" spellcheck="true" autocapitalize="sentences" aria-label="Document editor"></article></main>
<script>
(function(){
  const editor=document.getElementById('editor');
  let saveTimer=null;
  let suggesting=false;
  function notify(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{try{if(window.Native&&Native.onChange)Native.onChange(editor.innerHTML,editor.innerText||'',document.title||'Untitled document')}catch(e){}},450);
  }
  function focus(){editor.focus()}
  function command(cmd,value){focus();document.execCommand(cmd,false,value||null);notify()}
  function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function selectionSpan(style){focus();const sel=window.getSelection();if(!sel||!sel.rangeCount)return;const range=sel.getRangeAt(0);if(range.collapsed)return;const span=document.createElement('span');Object.assign(span.style,style);try{range.surroundContents(span)}catch(e){span.appendChild(range.extractContents());range.insertNode(span)}notify()}
  window.DocuMaker={
    setContent(html){editor.innerHTML=html||'';notify()},
    getHtml(){return editor.innerHTML},
    getText(){return editor.innerText||''},
    bold(){command('bold')},italic(){command('italic')},underline(){command('underline')},strike(){command('strikeThrough')},
    undo(){command('undo')},redo(){command('redo')},
    align(value){command(value==='left'?'justifyLeft':value==='center'?'justifyCenter':value==='right'?'justifyRight':'justifyFull')},
    list(value){command(value==='ordered'?'insertOrderedList':'insertUnorderedList')},
    indent(){command('indent')},outdent(){command('outdent')},
    block(value){focus();document.execCommand('formatBlock',false,value);notify()},
    font(value){command('fontName',value)},
    fontSize(px){selectionSpan({fontSize:px+'px'})},
    color(value){command('foreColor',value)},highlight(value){command('hiliteColor',value)},
    insertLink(url){if(url)command('createLink',url)},
    insertImage(data,alt){focus();document.execCommand('insertHTML',false,'<img src="'+data+'" alt="'+escapeHtml(alt||'Image')+'">');notify()},
    insertTable(rows,cols){let html='<table><tbody>';for(let r=0;r<rows;r++){html+='<tr>';for(let c=0;c<cols;c++)html+=(r===0?'<th>Header</th>':'<td>Cell</td>');html+='</tr>'}html+='</tbody></table><p></p>';command('insertHTML',html)},
    insertRule(){command('insertHorizontalRule')},
    insertPageBreak(){command('insertHTML','<div class="page-break" contenteditable="false"></div><p><br></p>')},
    insertChecklist(){command('insertHTML','<p>☐ Task item</p>')},
    addBookmark(name){command('insertHTML','<span class="bookmark-anchor" id="bm-'+Date.now()+'">◆ '+escapeHtml(name||'Bookmark')+' ◆</span>')},
    suggestions(enabled){suggesting=!!enabled;editor.dataset.suggesting=suggesting?'true':'false';},
    insertHeaderFooter(where){const markup=where==='header'?'<div class="doc-header" contenteditable="true">Document header</div>':'<div class="doc-footer" contenteditable="true">Document footer</div>';if(where==='header')editor.insertAdjacentHTML('afterbegin',markup);else editor.insertAdjacentHTML('beforeend',markup);notify();},
    addComment(note){const sel=window.getSelection();if(sel&&sel.rangeCount&&!sel.getRangeAt(0).collapsed){selectionSpan({background:'#fff1a8',borderBottom:'2px solid #c6a63d'});command('insertHTML','<sup title="Comment: '+escapeHtml(note)+'" style="color:#6557d2">[comment]</sup>')}else{command('insertHTML','<p><span style="color:#6557d2">[Comment: '+escapeHtml(note)+']</span></p>')}},
    find(term){if(!term)return 0;const walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);let count=0,node;while(node=walker.nextNode()){const idx=node.nodeValue.toLowerCase().indexOf(term.toLowerCase());if(idx>=0){const range=document.createRange();range.setStart(node,idx);range.setEnd(node,idx+term.length);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);range.startContainer.parentElement.scrollIntoView({block:'center'});count++;break}}return count},
    replace(search,replacement){if(!search)return 0;let count=0;const walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);const nodes=[];let node;while(node=walker.nextNode())nodes.push(node);nodes.forEach(n=>{const original=n.nodeValue;const re=new RegExp(search.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');n.nodeValue=original.replace(re,()=>{count++;return replacement})});notify();return count},
    count(){const text=(editor.innerText||'').trim();const words=text?text.match(/\S+/g).length:0;return {words,characters:text.length,charactersNoSpaces:text.replace(/\s/g,'').length,paragraphs:editor.querySelectorAll('p').length,headings:editor.querySelectorAll('h1,h2,h3,h4,h5,h6').length}},
    outline(){return Array.from(editor.querySelectorAll('h1,h2,h3,h4,h5,h6')).map((h,i)=>({text:h.innerText||'Untitled heading',level:Number(h.tagName.substring(1)),id:h.id||('heading-'+i)}))},
    pageSetup(size,margin){const sheet=document.querySelector('.sheet');sheet.style.maxWidth=size==='A4'?'794px':size==='Letter'?'816px':'100%';sheet.style.padding=margin+'px';notify()},
    printLayout(enabled){document.documentElement.classList.toggle('print-mode',!!enabled)},
    focus(){focus()},
    export(){return {html:editor.innerHTML,text:editor.innerText||''}}
  };
  editor.addEventListener('beforeinput',e=>{if(suggesting&&e.inputType==='insertText'&&e.data){e.preventDefault();document.execCommand('insertHTML',false,'<span class="suggestion-insert">'+escapeHtml(e.data)+'</span>');notify();}});
  editor.addEventListener('input',notify);editor.addEventListener('keyup',notify);editor.addEventListener('paste',()=>setTimeout(notify,50));
  editor.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();notify()} });
  setTimeout(()=>{if(window.Native&&Native.onEditorReady)Native.onEditorReady()},120);
})();
</script>
</body>
</html>
